name: research-ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-import-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.3
      - name: Print exact import-order patch
        run: |
          ruff check --select I --fix hti scripts test_assurance.py
          git diff -- hti scripts test_assurance.py
          test -z "$(git status --porcelain -- hti scripts test_assurance.py)"
