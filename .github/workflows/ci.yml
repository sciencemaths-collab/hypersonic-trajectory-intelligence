name: research-ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q hti scripts test_v63.py test_assurance.py
      - name: Unit verification
        run: python -m unittest -v test_v63.py test_assurance.py
      - name: Evidence integrity gate
        run: >-
          python scripts/evidence_gate.py
          benchmark_v64_maneuver_calibrated_metrics.json
          --fail-on engineering
          --report evidence_report.json
      - name: Lint assurance layer
        run: ruff check hti scripts/evidence_gate.py test_assurance.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Upload evidence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-audit-py${{ matrix.python-version }}
          path: evidence_report.json
          if-no-files-found: ignore
