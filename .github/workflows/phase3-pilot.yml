name: phase3-coverage-pilot

on:
  workflow_dispatch:
  push:
    branches: ["agent/nasa-research-readiness"]
    paths:
      - "phase3_pilot_trigger.txt"

permissions:
  contents: read

concurrency:
  group: phase3-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run development-only coverage pilot
        run: >-
          python scripts/hti_08_phase3_pilot.py
          --seed 17
          --out hti08_phase3_pilot.json
      - name: Summarize pilot gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("hti08_phase3_pilot.json").read_text())
          print(json.dumps({
              "pilot_gate_pass": report["pilot_gate_pass"],
              "samples": report["samples"],
              "coverage": report["coverage"],
          }, indent=2))
          PY
      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hti08-phase3-development-pilot
          path: hti08_phase3_pilot.json
          if-no-files-found: error
